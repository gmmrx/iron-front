<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>$GODOT_PROJECT_NAME</title>
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Barlow+Condensed:wght@400;600&display=swap" rel="stylesheet">
		<style>
html, body, #canvas { margin: 0; padding: 0; border: 0; }
body { color: #e8dfc8; background-color: #0b0d10; overflow: hidden; touch-action: none; }
#canvas { display: block; }
#canvas:focus { outline: none; }

/* Loading screen */
#status {
	position: absolute; inset: 0;
	display: flex; flex-direction: column; justify-content: flex-end; align-items: center;
	background:
		linear-gradient(180deg, rgba(11,13,16,0) 55%, rgba(11,13,16,0.55) 78%, rgba(11,13,16,0.92) 100%),
		url('$GODOT_SPLASH') center top / cover no-repeat, #0b0d10;
	font-family: 'Barlow Condensed', 'Noto Sans', Arial, sans-serif;
	letter-spacing: 0.04em;
	transition: opacity 0.6s ease;
	z-index: 10;
}
#status.fade { opacity: 0; pointer-events: none; }
#status-splash { display: none; }
#status-title, #status-rule, #status-sub { display: none; }
#status-panel {
	width: min(1100px, 92vw); margin-bottom: 4vh; padding: 22px 28px 24px;
	background: rgba(24, 34, 30, 0.86); border: 1px solid rgba(215,180,90,0.55); border-radius: 4px;
	box-shadow: 0 0 0 4px rgba(24,34,30,0.6), 0 18px 40px rgba(0,0,0,0.45);
	display: flex; flex-direction: column; align-items: center; text-align: center;
}
#status-head { font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 30px; letter-spacing: 0.32em; color: #efe6cf; }
#status-tip { margin-top: 14px; font-size: 17px; color: #bfb69f; min-height: 22px; font-style: italic; }
#status-title {
	font-family: 'Cinzel', 'Times New Roman', serif; font-weight: 700;
	font-size: clamp(40px, 7vw, 84px); line-height: 1; letter-spacing: 0.12em;
	background: linear-gradient(180deg, #f3e2a6 0%, #d7b45a 55%, #9c7a2e 100%);
	-webkit-background-clip: text; background-clip: text; color: transparent;
	text-shadow: none; filter: drop-shadow(0 2px 0 rgba(0,0,0,0.6)) drop-shadow(0 0 18px rgba(215,180,90,0.25));
}
#status-rule { width: min(520px, 70vw); height: 1px; margin: 18px 0 12px;
	background: linear-gradient(90deg, rgba(215,180,90,0) 0%, rgba(215,180,90,0.9) 50%, rgba(215,180,90,0) 100%); }
#status-sub { font-size: 18px; color: #bfb08c; letter-spacing: 0.32em; text-transform: uppercase; }
#status-bar { position: relative; width: min(640px, 80vw); height: 6px; margin-top: 16px;
	background: rgba(255,255,255,0.08); border: 1px solid rgba(215,180,90,0.35); border-radius: 3px; overflow: hidden; }
#status-fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0%;
	background: linear-gradient(90deg, #9c7a2e, #e8c96b); transition: width 0.25s ease; }
#status-bar.indeterminate #status-fill { width: 30%; animation: slide 1.4s ease-in-out infinite; }
@keyframes slide { 0% { left: -30%; } 100% { left: 100%; } }
#status-text { margin-top: 12px; font-size: 17px; color: #d8cba8; min-height: 22px; }
#status-music {
	position: absolute; bottom: 8px; left: 14px; font-size: 13px; letter-spacing: 0.08em; cursor: pointer;
	color: rgba(224,184,94,0.85); background: rgba(10,10,9,0.55); border: 1px solid rgba(140,122,75,0.6);
	padding: 4px 10px; border-radius: 2px; user-select: none;
}
#status-music:hover { color: #f0d08a; border-color: rgba(224,184,94,0.9); }
#status-hint { position: absolute; bottom: 8px; right: 14px; font-size: 13px; color: rgba(200,190,160,0.55); letter-spacing: 0.08em; }
#status-progress { display: none; }
#status-notice {
	display: none; margin-top: 28px; max-width: min(640px, 80vw);
	background: rgba(90, 40, 46, 0.55); border: 1px solid #9b3943; border-radius: 6px;
	color: #f0dcdc; line-height: 1.4; padding: 14px 18px; text-align: center; font-size: 16px;
}
		</style>
		$GODOT_HEAD_INCLUDE
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="$GODOT_SPLASH_CLASSES" src="$GODOT_SPLASH" alt="">
			<div id="status-title">IRON FRONT</div>
			<div id="status-rule"></div>
			<div id="status-sub">1936 – 1945 · Grand Strategy</div>
			<div id="status-panel">
				<div id="status-head">LOADING</div>
				<div id="status-text">Preparing…</div>
				<div id="status-bar"><div id="status-fill"></div></div>
				<div id="status-tip"></div>
				<progress id="status-progress"></progress>
				<div id="status-notice"></div>
			</div>
			<div id="status-music" title="Loading music">♪ Music: on</div>
			<div id="status-hint">First load is about 370 MB · a desktop browser is recommended</div>
		</div>

		<audio id="loading-music" src="loading_theme.mp3" loop preload="auto"></audio>

		<script src="$GODOT_URL"></script>
		<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');
	const statusBar = document.getElementById('status-bar');
	const statusFill = document.getElementById('status-fill');
	const statusText = document.getElementById('status-text');
	let phase = 'pack';
	const TIPS = [
		'Guarding your supply lines decides how hard your front-line troops can fight.',
		'A division waiting next to the enemy builds up preparation: its first blow lands harder.',
		'Attacks across a river lose 30%; try to open the bridgehead from another side.',
		'In winter, attacks north of 45° weaken and troops without winter kit wear down.',
		'Divisions shipped across seas you do not control take losses on the way.',
		'Civilian factories build military factories: industry first, then the army.',
		'State programs cannot be undone; each one takes 35–70 days.',
		'Deploy air wings to a base and give them a mission region; they cannot fly beyond their range.',
		'Armoured and motorised divisions burn fuel; without oil they lose 35% of their strength.',
		'Form armies and give them a front: their divisions spread out to match the enemy.',
	];
	// loading music: if the browser blocks autoplay it starts on the first click/key; the choice is remembered
	const music = document.getElementById('loading-music');
	const musicBtn = document.getElementById('status-music');
	let musicOn = true;
	try { musicOn = localStorage.getItem('ironfront_loading_music') !== 'off'; } catch (e) { /* private window */ }
	music.volume = 0.55;
	const showMusic = () => { musicBtn.textContent = '♪ Music: ' + (musicOn ? 'on' : 'off'); };
	const tryPlay = () => { if (musicOn && music.paused) { music.play().catch(() => {}); } };
	showMusic();
	tryPlay();
	const firstGesture = () => { tryPlay(); window.removeEventListener('pointerdown', firstGesture); window.removeEventListener('keydown', firstGesture); };
	window.addEventListener('pointerdown', firstGesture);
	window.addEventListener('keydown', firstGesture);
	musicBtn.addEventListener('click', (ev) => {
		ev.stopPropagation();
		musicOn = !musicOn;
		try { localStorage.setItem('ironfront_loading_music', musicOn ? 'on' : 'off'); } catch (e) { /* yok say */ }
		if (musicOn) { tryPlay(); } else { music.pause(); }
		showMusic();
	});
	function fadeOutMusic() {
		if (music.paused) { return; }
		const start = music.volume;
		const t0 = performance.now();
		const stepFade = (now) => {
			const k = Math.min((now - t0) / 2500, 1);
			music.volume = start * (1 - k);
			if (k < 1) { requestAnimationFrame(stepFade); } else { music.pause(); }
		};
		requestAnimationFrame(stepFade);
	}

	const statusTip = document.getElementById('status-tip');
	let tipIndex = Math.floor(Math.random() * TIPS.length);
	const showTip = () => { statusTip.textContent = TIPS[tipIndex % TIPS.length]; tipIndex += 1; };
	showTip();
	setInterval(showTip, 6000);

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			fadeOutMusic();
			statusOverlay.classList.add('fade');
			setTimeout(() => statusOverlay.remove(), 700);
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusBar.style.display = mode === 'progress' ? 'block' : 'none';
		statusText.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		const mb = (n) => (n / 1048576).toFixed(0);
		const onProgress = function (current, total) {
			if (current > 0 && total > 0) {
				statusBar.classList.remove('indeterminate');
				statusFill.style.width = (100 * current / total).toFixed(1) + '%';
				statusText.textContent = (phase === 'pack' ? 'Downloading map and units' : 'Loading engine') + ' · ' + mb(current) + ' / ' + mb(total) + ' MB';
			} else {
				statusBar.classList.add('indeterminate');
				statusText.textContent = phase === 'pack' ? 'Preparing…' : 'Starting… (building the map, this can take a few seconds)';
			}
		};

		// GitHub Pages allows 100 MB per file: CI splits the pck (index.pck.partNN + index.pck.parts.json),
		// here the parts are downloaded and handed to the engine as one Blob. Without a part list the plain index.pck is used.
		async function loadSplitPack() {
			const exe = GODOT_CONFIG['executable'] || 'index';
			let manifest;
			try {
				const r = await fetch(exe + '.pck.parts.json', { cache: 'no-cache' });
				if (!r.ok) { return null; }
				manifest = await r.json();
			} catch (e) { return null; }
			const total = manifest.size || 0;
			let loaded = 0;
			const buffers = [];
			for (const name of manifest.parts) {
				const r = await fetch(name);
				if (!r.ok) { throw new Error('Could not download package part: ' + name); }
				const reader = r.body.getReader();
				const chunks = [];
				for (;;) {
					const { done, value } = await reader.read();
					if (done) { break; }
					chunks.push(value);
					loaded += value.byteLength;
					onProgress(loaded, total);
				}
				buffers.push(new Blob(chunks));
			}
			return URL.createObjectURL(new Blob(buffers, { type: 'application/octet-stream' }));
		}
		loadSplitPack().then((mainPack) => {
			phase = 'engine';
			statusBar.classList.add('indeterminate');
			statusText.textContent = 'Starting… (building the map, this can take a few seconds)';
			const opts = { 'onProgress': onProgress };
			if (mainPack) { opts['mainPack'] = mainPack; }
			return engine.startGame(opts);
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
